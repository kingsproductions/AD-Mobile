<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Shop System</title>
    <style>
        * {
            box-sizing: border-box
        }

        body {
            margin: 0;
            font: 14px Arial, sans-serif;
            background: #eef2f6;
            color: #1d2733
        }

        header {
            background: #1F4E78;
            color: #fff;
            padding: 8px 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 8px
        }

        nav button {
            background: none;
            border: 0;
            border-bottom: 2px solid transparent;
            color: #bcd2e8;
            padding: 8px 12px;
            cursor: pointer;
            font-size: 14px
        }

        nav button.on {
            color: #fff;
            border-color: #fff
        }

        main {
            max-width: 1000px;
            margin: 16px auto;
            padding: 0 12px
        }

        .card {
            background: #fff;
            border-radius: 6px;
            padding: 14px;
            margin-bottom: 14px;
            border: 1px solid #d5dde6
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 10px;
            margin-bottom: 14px
        }

        .k {
            background: #fff;
            border: 1px solid #d5dde6;
            border-left: 4px solid #1F4E78;
            border-radius: 6px;
            padding: 10px
        }

        .k b {
            display: block;
            font-size: 20px;
            margin-top: 4px
        }

        input,
        select {
            padding: 8px;
            border: 1px solid #aab4bf;
            border-radius: 5px;
            font-size: 14px
        }

        button.p {
            padding: 8px 14px;
            background: #1F4E78;
            color: #fff;
            border: 0;
            border-radius: 5px;
            cursor: pointer;
            font-size: 14px
        }

        button.d {
            background: #b3261e;
            color: #fff;
            border: 0;
            border-radius: 4px;
            padding: 4px 8px;
            cursor: pointer
        }

        button:focus-visible,
        input:focus-visible,
        select:focus-visible {
            outline: 2px solid #e8a317
        }

        table {
            width: 100%;
            border-collapse: collapse
        }

        th {
            background: #1F4E78;
            color: #fff;
            text-align: left;
            padding: 7px
        }

        td {
            padding: 5px 7px;
            border-bottom: 1px solid #e3e8ee
        }

        td input {
            width: 90px
        }

        .tw {
            overflow-x: auto
        }

        .low {
            color: #9a5b00;
            font-weight: bold
        }

        .out {
            color: #b3261e;
            font-weight: bold
        }

        .row {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            align-items: end
        }

        label {
            font-size: 12px;
            display: block;
            color: #555;
            margin-bottom: 2px
        }

        h3 {
            margin: 0 0 10px
        }

        #login {
            max-width: 340px;
            margin: 70px auto
        }

        #login input {
            width: 100%;
            margin-bottom: 10px
        }

        .x td {
            color: #999
        }

        .x td:nth-last-child(-n+2) {
            color: #1d2733
        }

        details.m {
            position: relative
        }

        summary {
            cursor: pointer;
            font-weight: bold;
            list-style: none;
            padding: 0 8px
        }

        .mm {
            position: absolute;
            right: 0;
            z-index: 5;
            background: #fff;
            border: 1px solid #aab4bf;
            border-radius: 5px;
            min-width: 160px;
            box-shadow: 0 2px 6px #0003
        }

        .mm a {
            display: block;
            padding: 8px 10px;
            cursor: pointer
        }

        .mm a:hover {
            background: #eef2f6
        }

        .mo {
            position: fixed;
            inset: 0;
            background: #0006;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 9
        }

        .mc {
            background: #fff;
            border-radius: 6px;
            padding: 16px;
            width: min(360px, 92vw)
        }

        .mc input,
        .mc select {
            width: 100%;
            margin-bottom: 8px
        }

        .tw {
            min-height: 150px
        }

        .adjr td {
            background: #fff3cd
        }

        .adj {
            background: #ffe08a;
            color: #7a4b00;
            padding: 2px 6px;
            border-radius: 4px;
            font-weight: bold;
            font-size: 12px;
            display: inline-block
        }

        .x.adjr td {
            background: none
        }

        .ib {
            display: inline-flex;
            align-items: center;
            gap: 4px
        }
    </style>
</head>

<body>
    <div id="app"></div>
    <div id="md"></div>
    <script>
        const K = "shopdb1", $ = s => document.querySelector(s);
        const seed = [["Back Sheet Matte Paper", 50, 75], ["Back Sheet Matte 3D", 58, 90], ["Back Sheet Matte Leather", 13, 130], ["Jonny Hand-free", 16, 310], ["Black-Airbuds", 10, 560], ["White-Airbuds", 5, 460], ["Cable Sunny", 4, 155], ["Cable 86 Romoss", 20, 95], ["Pic Type C (Cable)", 30, 70], ["USB C Charger 20W", 2, 620], ["USB Charger 35W", 2, 720], ["Samsung Adaptor", 5, 470], ["Vivo Flash Charger Fast", 5, 620], ["iPhone Cable C to Lightning", 20, 90], ["iPhone Cable USB", 5, 155], ["Cable C to C", 10, 95], ["Handsfree", 5, 260], ["Google Charger 30W", 2, 620], ["Power Bank 10000 mAh (KR)", 1, 1870], ["Power Bank 10000 mAh Fast X", 1, 1270], ["Power Bank 20000 mAh Fast X", 1, 2700], ["Trinex", 2, 1550], ["Type C Load (Cable)", 10, 95], ["P47 Wireless Headphone", 1, 650], ["Pics Romoss", 5, 105], ["Glass 9D", 200, 55], ["New Mobile (Glass)", 15, 60], ["New S20", 5, 60]];
        const MN = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"];
        let db = JSON.parse(localStorage.getItem(K) || "null"), me = null, tab = "", sd = "";
        const save = () => localStorage.setItem(K, JSON.stringify(db));
        const H = async s => { try { const b = await crypto.subtle.digest("SHA-256", new TextEncoder().encode("shop" + s)); return [...new Uint8Array(b)].map(x => x.toString(16).padStart(2, "0")).join("") } catch (e) { return btoa("shop" + s) } };
        const fmt = n => Number(n || 0).toLocaleString("en-PK"), dk = t => new Date(t).toLocaleDateString("en-CA"), now = () => dk(Date.now());
        const fx = s => s.qty * s.rate, tot = s => s.total != null ? s.total : s.qty * s.rate, paid = s => s.paid != null ? s.paid : tot(s), prof = s => tot(s) - s.qty * s.cost, nm = () => (db.set && db.set.name) || "Shop System", sum = (a, f) => a.reduce((x, y) => x + f(y), 0);
        const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
        const opt = a => a.map(i => `<option value="${i.id}">${esc(i.name)} (${i.qty})</option>`).join("");
        const item = id => db.items.find(i => i.id == id);
        async function init() { if (!db) { db = { items: seed.map((s, i) => ({ id: i + 1, name: s[0], qty: s[1], cost: s[2], price: s[2] })), sales: [], restocks: [], users: [{ u: "admin", p: await H("admin123"), role: "admin" }, { u: "staff", p: await H("staff123"), role: "staff" }], low: 3, nid: 1000, logs: [], set: { staffStock: false, staffCost: false, name: "Shop System" } }; save() } fix(); sd = now(); render() }
        function fix() { db.logs = db.logs || []; db.set = db.set || { staffStock: false, staffCost: false }; db.set.name = db.set.name || "Shop System"; document.title = db.set.name; db.sales.forEach(s => { s.status = s.status || "ok" }) }
        const act = i => i.active !== false, tm = t => new Date(t).toLocaleTimeString("en-US", { hour: "numeric", minute: "2-digit" }), dt = t => dk(t) + " " + tm(t), sale = id => db.sales.find(x => x.id == id);
        const log = (type, ref, o, n, why) => db.logs.push({ ts: Date.now(), type, ref, old: o, new: n, by: me.u, why: why || "" });
        const showMd = h => $("#md").innerHTML = `<div class="mo"><div class="mc">${h}</div></div>`, closeMd = () => $("#md").innerHTML = "";
        function render() {
            const a = $("#app");
            if (!me) { a.innerHTML = `<div id="login" class="card"><h3>${esc(nm())} - Login</h3><label>Username</label><input id="lu"><label>Password</label><input id="lp" type="password" onkeydown="if(event.key=='Enter')login()"><button class="p" onclick="login()">Login</button><p><small>Enter Username Or Password</small></p></div>`; return }
            const AD = ["dash", "stock", "re", "logs", "usr", "bk", "set"]; if (me.role != "admin" && (AD.includes(tab) || (tab == "sv" && !db.set.staffStock))) tab = "sale";
            const T = me.role == "admin" ? [["dash", "Dashboard"], ["sale", "Sales"], ["stock", "Stock"], ["re", "Restock"], ["logs", "Logs"], ["usr", "Users"], ["set", "Settings"], ["bk", "Backup"]] : [["sale", "Sales Entry"]].concat(db.set.staffStock ? [["sv", "Stock"]] : []);
            document.title = nm(); a.innerHTML = `<header><b>${esc(nm())}</b><nav>${T.map(t => `<button class="${tab == t[0] ? "on" : ""}" onclick="tab='${t[0]}';render()">${t[1]}</button>`).join("")}</nav><span>${esc(me.u)} (${me.role}) <button class="p" onclick="me=null;render()">Logout</button></span></header><main>${({ dash: vDash, sale: vSale, sv: vSV, stock: vStock, re: vRe, logs: vLog, usr: vUsr, bk: vBk, set: vSet })[tab]()}</main>`;
            if (tab == "sale") pv(1)
        }
        async function login() { const u = $("#lu").value.trim(), p = await H($("#lp").value), x = db.users.find(y => y.u == u && y.p == p); if (!x) return alert("Username ya password galat hai."); me = { u: x.u, role: x.role }; tab = x.role == "admin" ? "dash" : "sale"; render() }
        // ---- Sales
        const canRe = s => s.status == "cancelled" && (me.role == "admin" || (s.by == me.u && dk(s.ts) == now()));
        const canEdit = s => s.status != "cancelled" && (me.role == "admin" || (s.by == me.u && dk(s.ts) == now()));
        function row(s, ad) { const c = s.status == "cancelled", f = fx(s), t = tot(s), aj = f != t; return `<tr class="${c ? "x " : ""}${aj ? "adjr" : ""}"><td>${ad ? dt(s.ts) : tm(s.ts)}${s.editTs ? `<br><small>Edit: ${dt(s.editTs)} (${esc(s.editBy)})</small>` : ""}<td>${esc(s.name)}<td>${s.qty}<td>${fmt(s.rate)}<td>${fmt(f)}<td>${fmt(t)}${aj ? `<br><span class="adj">Customer Adjustment ${t < f ? "-" : "+"}${fmt(Math.abs(f - t))}</span>` : ""}<td>${fmt(paid(s))}${paid(s) < t ? `<br><small>Baqaya ${fmt(t - paid(s))}</small>` : ""}${ad ? `<td>${fmt(prof(s))}<td>${esc(s.by)}` : ""}<td>${c ? "Cancelled" : "OK"}<td><details class="m"><summary>&#8943;</summary><div class="mm">${canEdit(s) ? `<a onclick="editSale(${s.id})">Edit</a><a onclick="cancelSale(${s.id})">Return / Cancel Sale</a>` : ""}${canRe(s) ? `<a onclick="restoreSale(${s.id})">Activate Again (Restore)</a>` : ""}<a onclick="viewHist(${s.id})">View History</a></div></details></tr>` }
        function vSale() {
            const ad = me.role == "admin", d = ad ? sd : now(), A = db.sales.filter(s => dk(s.ts) == d && (ad || s.by == me.u)).sort((a, b) => b.ts - a.ts), L = A.filter(s => s.status != "cancelled"), M = db.sales.filter(s => s.status != "cancelled" && dk(s.ts).slice(0, 7) == d.slice(0, 7)), k = (a, b) => `<div class="k">${a}<b>${b}</b></div>`;
            return `<div class="card"><h3>Nai Bikri</h3><div class="row"><div><label>Item</label><select id="si" onchange="pv(1)">${opt(db.items.filter(i => act(i) && i.qty > 0))}</select></div><div><label>Qty</label><input id="sq" type="number" min="1" value="1" style="width:80px" oninput="pv(1)"></div><div><label>Rate (fixed)</label><b id="sr"></b></div><div><label>Fixed Total</label><b id="sf"></b></div><div><label>Customer Agreed Total</label><input id="st" type="number" min="0" style="width:130px" oninput="pv(0,1)"></div><div><label>Customer ne diye (Rs)</label><input id="sp" type="number" min="0" style="width:130px" oninput="pv(0,0,1)"></div><div><label>Rate/pc (adjusted)</label><b id="sa"></b></div><button class="p" onclick="addSale()">Save Sale</button></div><div id="sn" style="margin-top:6px"></div><small>Date aur time khud save hote hain. Agreed Total badalne se sirf ye bikri adjust hoti hai, item ka fixed rate wohi rehta hai. Fixed Total record ke liye save hota hai.</small></div>
${ad ? `<div class="grid">${k("Is din ki Sale", fmt(sum(L, tot)))}${k("Is din ka Profit", fmt(sum(L, prof)))}${k("Items Sold", sum(L, s => s.qty))}${k("Mahine ki Sale", fmt(sum(M, tot)))}${k("Mahine ka Profit", fmt(sum(M, prof)))}</div>` : ""}
<div class="card"><div class="row"><h3>${ad ? "Sales ki list" : "Aaj ki Sales"}</h3>${ad ? `<input type="date" value="${sd}" onchange="sd=this.value;render()">` : ""}<button class="p ib" title="Excel export" onclick="expSales()">&#128229; Excel</button></div><div class="tw"><table><tr><th>${ad ? "Entry (Date/Time)" : "Time"}<th>Item<th>Qty<th>Rate<th>Fixed Total<th>Customer Total<th>Paid${ad ? "<th>Profit<th>By" : ""}<th>Status<th>Action</tr>${A.map(s => row(s, ad)).join("")}<tr><th colspan="4">Total<th>${fmt(sum(L, fx))}<th>${fmt(sum(L, tot))}<th>${fmt(sum(L, paid))}${ad ? `<th>${fmt(sum(L, prof))}<th>` : ""}<th><th></tr></table></div></div>`
        }
        let pd = 0;
        function pv(r, a, p) {
            const i = item($("#si").value), q = +$("#sq").value || 0, f = i ? i.price * q : 0, T = $("#st"), P = $("#sp"); if (r) { T.value = f; P.value = f; pd = 0 } if (a && !pd) P.value = T.value; if (p) pd = 1; const t = +T.value || 0, x = +P.value || 0;
            $("#sr").textContent = i ? fmt(i.price) : "-"; $("#sf").textContent = fmt(f); $("#sa").innerHTML = q ? fmt(+(t / q).toFixed(2)) + (t != f && i ? ` <small>(fixed ${fmt(i.price)})</small>` : "") : "-";
            let h = ""; if (t != f) h += `<span class="adj">Customer Adjustment: ${t < f ? "Discount" : "Extra"} ${fmt(Math.abs(f - t))} (Fixed ${fmt(f)} → Agreed ${fmt(t)})</span> `; if (x < t) h += `<span class="adj">Baqaya: ${fmt(t - x)}</span>`; $("#sn").innerHTML = h
        }
        function addSale() {
            const i = item($("#si").value), q = parseInt($("#sq").value), t = +$("#st").value, pa = +$("#sp").value, ad = me.role == "admin"; if (!i) return alert("Item chunein."); if (!(q >= 1)) return alert("Qty 1 ya zyada likhein."); if (q > i.qty) return alert("Stock kam hai. Sirf " + i.qty + " bachi hain.");
            if ($("#st").value === "" || !(t >= 0)) return alert("Customer Agreed Total likhein."); if (t < i.cost * q) return alert("Is total par loss hoga. Minimum total " + fmt(i.cost * q) + " hona chahiye."); if (!ad && t > i.price * q) return alert("Total Fixed Total (" + fmt(i.price * q) + ") se zyada nahi ho sakta."); if ($("#sp").value === "" || !(pa >= 0) || pa > t) return alert("Customer ne diye paisay 0 se Agreed Total ke beech likhein.");
            if (db.sales.find(s => s.by == me.u && s.iid == i.id && s.qty == q && s.status != "cancelled" && Date.now() - s.ts < 120000) && !confirm("Ye sale abhi abhi save ho chuki hai. Phir bhi save karein?")) return;
            db.sales.push({ id: db.nid++, ts: Date.now(), iid: i.id, name: i.name, qty: q, rate: i.price, total: t, paid: pa, cost: i.cost, by: me.u, status: "ok", hist: [] }); i.qty -= q; save(); render()
        }
        function editSale(id) {
            const s = sale(id); if (!canEdit(s)) return alert("Ye entry aap edit nahi kar sakte."); if (!item(s.iid)) return alert("Ye item delete ho chuka hai, edit nahi ho sakta.");
            showMd(`<h3>Sale Edit</h3><label>Item</label><select id="ei" onchange="ep(2)">${db.items.filter(i => act(i) || i.id == s.iid).map(i => `<option value="${i.id}" ${i.id == s.iid ? "selected" : ""}>${esc(i.name)} (${i.qty + (i.id == s.iid ? s.qty : 0)})</option>`).join("")}</select><label>Qty</label><input id="eq" type="number" min="1" value="${s.qty}" oninput="ep(1)"><label>Rate (fixed)</label><input id="er" type="number" value="${s.rate}" oninput="ep(1)"><p>Fixed Total: <b id="ef"></b></p><label>Customer Agreed Total</label><input id="et" type="number" min="0" value="${tot(s)}" oninput="ep()"><label>Customer ne diye (Rs)</label><input id="ep" type="number" min="0" value="${paid(s)}"><p id="en"></p><button class="p" onclick="saveEdit(${id})">Save Edit</button> <button onclick="closeMd()">Cancel</button>`); ep()
        }
        function ep(c) { if (c == 2) $("#er").value = item($("#ei").value).price; const f = ($("#eq").value || 0) * ($("#er").value || 0); if (c) { $("#et").value = f; $("#ep").value = f } const t = +$("#et").value || 0; $("#ef").textContent = fmt(f); $("#en").innerHTML = t != f ? `<span class="adj">Customer Adjustment: ${t < f ? "Discount" : "Extra"} ${fmt(Math.abs(f - t))}</span>` : "" }
        function saveEdit(id) {
            const s = sale(id), ad = me.role == "admin", n = item($("#ei").value), o = item(s.iid), q = parseInt($("#eq").value), r = +$("#er").value, t = +$("#et").value, pa = +$("#ep").value;
            if (!(q >= 1)) return alert("Qty 1 ya zyada honi chahiye. Poori sale wapis karni ho to Return / Cancel use karein.");
            if (q > n.qty + (o && o.id == n.id ? s.qty : 0)) return alert("Stock kam hai.");
            const c = n.id == s.iid ? s.cost : n.cost;
            if (!(r >= 0) || $("#et").value === "" || !(t >= 0)) return alert("Rate aur Agreed Total sahi likhein."); if (t < c * q) return alert("Is total par loss hoga. Minimum total " + fmt(c * q) + " hona chahiye.");
            if (!ad && r > n.price) return alert("Rate Sale Price se zyada nahi ho sakta."); if (!ad && t > r * q) return alert("Total Fixed Total se zyada nahi ho sakta."); if (!(pa >= 0) || pa > t) return alert("Customer ne diye paisay 0 se Agreed Total ke beech likhein.");
            const a = `${s.name} x${s.qty} @${s.rate} total ${tot(s)} paid ${paid(s)}`, b = `${n.name} x${q} @${r} total ${t} paid ${pa}`; if (a == b) return closeMd();
            if (!confirm("Kya aap is naye edit ko save karna chahte hain?")) return closeMd();
            if (o) o.qty += s.qty; n.qty -= q; Object.assign(s, { iid: n.id, name: n.name, qty: q, rate: r, total: t, paid: pa, cost: c, editTs: Date.now(), editBy: me.u }); (s.hist = s.hist || []).push({ ts: Date.now(), by: me.u, txt: a + " -> " + b }); log("Sale Edit", "Sale #" + id, a, b); save(); closeMd(); render()
        }
        function cancelSale(id) { const s = sale(id); if (!canEdit(s)) return; if (!confirm("Poori sale wapis/cancel karein? Qty stock mein wapas chali jayegi.")) return; const o = item(s.iid); if (o) o.qty += s.qty; s.status = "cancelled"; s.editTs = Date.now(); s.editBy = me.u; (s.hist = s.hist || []).push({ ts: Date.now(), by: me.u, txt: "Cancelled / Return" }); log("Sale Cancel", "Sale #" + id, `${s.name} x${s.qty}`, "Cancelled"); save(); render() }
        function restoreSale(id) { const s = sale(id); if (!s || !canRe(s)) return; const o = item(s.iid); if (!o) return alert("Ye item delete ho chuka hai, sale dobara active nahi ho sakti."); if (o.qty < s.qty) return alert("Stock kam hai. " + o.name + " ki sirf " + o.qty + " bachi hain."); if (!confirm("Ye sale dobara active (OK) karein? Qty stock se dobara minus hogi.")) return; o.qty -= s.qty; s.status = "ok"; s.editTs = Date.now(); s.editBy = me.u; (s.hist = s.hist || []).push({ ts: Date.now(), by: me.u, txt: "Restored / Activated again" }); log("Sale Restore", "Sale #" + id, "Cancelled", `${s.name} x${s.qty}`); save(); render() }
        function viewHist(id) { const s = sale(id); alert("Original entry: " + dt(s.ts) + " (" + s.by + ")\n" + `${s.name} x${s.qty} @${s.rate} | Fixed ${fmt(fx(s))} | Customer Total ${fmt(tot(s))} | Paid ${fmt(paid(s))}\n\n` + ((s.hist || []).map(h => dt(h.ts) + " (" + h.by + "): " + h.txt).join("\n") || "Koi change nahi hua.")) }
        // ---- Dashboard
        function vDash() {
            const t = now(), m = t.slice(0, 7), y = t.slice(0, 4), S = db.sales.filter(s => s.status != "cancelled"), T = S.filter(s => dk(s.ts) == t), M = S.filter(s => dk(s.ts).slice(0, 7) == m), k = (a, b) => `<div class="k">${a}<b>${b}</b></div>`, lo = db.items.filter(i => i.qty <= db.low);
            let r = ""; for (let i = 1; i <= 12; i++) { const A = S.filter(s => dk(s.ts).slice(0, 7) == y + "-" + String(i).padStart(2, "0")); r += `<tr><td>${MN[i - 1]}<td>${fmt(sum(A, tot))}<td>${fmt(sum(A, prof))}<td>${sum(A, s => s.qty)}</tr>` }
