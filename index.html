<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Shop System</title>
    <style>
        * {
            box-sizing: border-box
        }

        body {
            margin: 0;
            font: 14px Arial, sans-serif;
            background: #eef2f6;
            color: #1d2733
        }

        header {
            background: #1F4E78;
            color: #fff;
            padding: 8px 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 8px
        }

        nav button {
            background: none;
            border: 0;
            border-bottom: 2px solid transparent;
            color: #bcd2e8;
            padding: 8px 12px;
            cursor: pointer;
            font-size: 14px
        }

        nav button.on {
            color: #fff;
            border-color: #fff
        }

        main {
            max-width: 1000px;
            margin: 16px auto;
            padding: 0 12px
        }

        .card {
            background: #fff;
            border-radius: 6px;
            padding: 14px;
            margin-bottom: 14px;
            border: 1px solid #d5dde6
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 10px;
            margin-bottom: 14px
        }

        .k {
            background: #fff;
            border: 1px solid #d5dde6;
            border-left: 4px solid #1F4E78;
            border-radius: 6px;
            padding: 10px
        }

        .k b {
            display: block;
            font-size: 20px;
            margin-top: 4px
        }

        input,
        select {
            padding: 8px;
            border: 1px solid #aab4bf;
            border-radius: 5px;
            font-size: 14px
        }

        button.p {
            padding: 8px 14px;
            background: #1F4E78;
            color: #fff;
            border: 0;
            border-radius: 5px;
            cursor: pointer;
            font-size: 14px
        }

        button.d {
            background: #b3261e;
            color: #fff;
            border: 0;
            border-radius: 4px;
            padding: 4px 8px;
            cursor: pointer
        }

        button:focus-visible,
        input:focus-visible,
        select:focus-visible {
            outline: 2px solid #e8a317
        }

        table {
            width: 100%;
            border-collapse: collapse
        }

        th {
            background: #1F4E78;
            color: #fff;
            text-align: left;
            padding: 7px
        }

        td {
            padding: 5px 7px;
            border-bottom: 1px solid #e3e8ee
        }

        td input {
            width: 90px
        }

        .tw {
            overflow-x: auto
        }

        .low {
            color: #9a5b00;
            font-weight: bold
        }

        .out {
            color: #b3261e;
            font-weight: bold
        }

        .row {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            align-items: end
        }

        label {
            font-size: 12px;
            display: block;
            color: #555;
            margin-bottom: 2px
        }

        h3 {
            margin: 0 0 10px
        }

        #login {
            max-width: 340px;
            margin: 70px auto
        }

        #login input {
            width: 100%;
            margin-bottom: 10px
        }

        .x td {
            color: #999
        }

        .x td:nth-last-child(-n+2) {
            color: #1d2733
        }

        details.m {
            position: relative
        }

        summary {
            cursor: pointer;
            font-weight: bold;
            list-style: none;
            padding: 0 8px
        }

        .mm {
            position: absolute;
            right: 0;
            z-index: 5;
            background: #fff;
            border: 1px solid #aab4bf;
            border-radius: 5px;
            min-width: 160px;
            box-shadow: 0 2px 6px #0003
        }

        .mm a {
            display: block;
            padding: 8px 10px;
            cursor: pointer
        }

        .mm a:hover {
            background: #eef2f6
        }

        .mo {
            position: fixed;
            inset: 0;
            background: #0006;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 9
        }

        .mc {
            background: #fff;
            border-radius: 6px;
            padding: 16px;
            width: min(360px, 92vw)
        }

        .mc input,
        .mc select {
            width: 100%;
            margin-bottom: 8px
        }

        .tw {
            min-height: 150px
        }

        .adjr td {
            background: #fff3cd
        }

        .adj {
            background: #ffe08a;
            color: #7a4b00;
            padding: 2px 6px;
            border-radius: 4px;
            font-weight: bold;
            font-size: 12px;
            display: inline-block
        }

        .x.adjr td {
            background: none
        }

        .ib {
            display: inline-flex;
            align-items: center;
            gap: 4px
        }

        .ov td {
            background: #fde7e7
        }

        .cl {
            color: #1b6e2d;
            font-weight: bold
        }
    </style>
</head>

<body>
    <div id="app"></div>
    <div id="md"></div>
    <script>
        let K = "shopdb1"; const RK = "shopown1", $ = s => document.querySelector(s);
        const seed = [["Back Sheet Matte Paper", 50, 75], ["Back Sheet Matte 3D", 58, 90], ["Back Sheet Matte Leather", 13, 130], ["Jonny Hand-free", 16, 310], ["Black-Airbuds", 10, 560], ["White-Airbuds", 5, 460], ["Cable Sunny", 4, 155], ["Cable 86 Romoss", 20, 95], ["Pic Type C (Cable)", 30, 70], ["USB C Charger 20W", 2, 620], ["USB Charger 35W", 2, 720], ["Samsung Adaptor", 5, 470], ["Vivo Flash Charger Fast", 5, 620], ["iPhone Cable C to Lightning", 20, 90], ["iPhone Cable USB", 5, 155], ["Cable C to C", 10, 95], ["Handsfree", 5, 260], ["Google Charger 30W", 2, 620], ["Power Bank 10000 mAh (KR)", 1, 1870], ["Power Bank 10000 mAh Fast X", 1, 1270], ["Power Bank 20000 mAh Fast X", 1, 2700], ["Trinex", 2, 1550], ["Type C Load (Cable)", 10, 95], ["P47 Wireless Headphone", 1, 650], ["Pics Romoss", 5, 105], ["Glass 9D", 200, 55], ["New Mobile (Glass)", 15, 60], ["New S20", 5, 60]];
        const MN = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"];
        let db = null, me = null, tab = "", sd = "", reg = null, ow = null, cur = null, lm = "shop", ot = "dash", lsh = 0;
        const save = () => localStorage.setItem(K, JSON.stringify(db));
        const H = async s => { try { const b = await crypto.subtle.digest("SHA-256", new TextEncoder().encode("shop" + s)); return [...new Uint8Array(b)].map(x => x.toString(16).padStart(2, "0")).join("") } catch (e) { return btoa("shop" + s) } };
        const fmt = n => Number(n || 0).toLocaleString("en-PK"), dk = t => new Date(t).toLocaleDateString("en-CA"), now = () => dk(Date.now());
        const fx = s => s.qty * s.rate, tot = s => s.total != null ? s.total : s.qty * s.rate, paid = s => s.paid != null ? s.paid : tot(s), prof = s => tot(s) - s.qty * s.cost, nm = () => (db && db.set && db.set.name) || "Shop System", sum = (a, f) => a.reduce((x, y) => x + f(y), 0);
        const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
        const opt = a => a.map(i => `<option value="${i.id}">${esc(i.name)} (${i.qty})</option>`).join("");
        const item = id => db.items.find(i => i.id == id);
        // ================= OWNER LAYER (multi-shop) =================
        const sv2 = () => localStorage.setItem(RK, JSON.stringify(reg)), shp = id => reg.shops.find(s => s.id == id), sDb = s => JSON.parse(localStorage.getItem(s.key) || "null"), pDb = (s, d) => localStorage.setItem(s.key, JSON.stringify(d));
        const MENUS = [["dash", "Dashboard"], ["sale", "Sales"], ["ud", "Udhar"], ["stock", "Stock"], ["re", "Restock"], ["logs", "Logs"], ["usr", "Users"], ["set", "Settings"], ["bk", "Backup"]], mOn = k => !cur || (cur.menus || {})[k] !== false;
        const OT = [["dash", "Dashboard"], ["shops", "Shops"], ["bills", "Bills"], ["own", "Owners"], ["obk", "Backup"]], oAcc = k => ow.role == "super" || !!(ow.access && ow.access[k]);
        const evt = (s, t) => { (s.ev = s.ev || []).push({ ts: Date.now(), by: ow ? ow.u : "system", txt: t }) };
        const mAdd = (m, n) => { let [y, x] = m.split("-").map(Number); x += n; y += Math.floor((x - 1) / 12); x = ((x - 1) % 12 + 12) % 12 + 1; return y + "-" + String(x).padStart(2, "0") };
        const addD = (d, n) => { const x = new Date(d + "T00:00:00"); x.setDate(x.getDate() + n); return dk(x) };
        const bDue = (s, b) => b.m + "-" + String(Math.min(Math.max(+s.dueDay || 10, 1), 28)).padStart(2, "0"), bPaid = b => sum(b.pays, p => p.amt), bBal = b => Math.max(0, Math.round((b.amt - bPaid(b)) * 100) / 100);
        const bOv = (s, b) => bBal(b) > 0 && now() > addD(bDue(s, b), +s.grace || 0), bSt = (s, b) => bBal(b) <= 0 ? "Paid" : now() > bDue(s, b) ? "Overdue" : "Due", sOv = s => s.bills.some(b => bOv(s, b)), sBal = s => sum(s.bills, bBal);
        const bCls = t => t == "Paid" ? "cl" : t == "Overdue" ? "out" : "low", rnd = () => String(crypto.getRandomValues(new Uint32Array(1))[0] % 900000 + 100000);
        const adm = s => ((sDb(s) || { users: [] }).users.filter(u => u.role == "admin").map(u => u.u).join(", "));
        const sItems = () => seed.map((s, i) => ({ id: i + 1, name: s[0], qty: s[1], cost: s[2], price: s[2] }));
        async function mkDb(name, au, ap, items, staff) { const us = [{ u: au, p: await H(ap), role: "admin" }]; if (staff) us.push({ u: "staff", p: await H("staff123"), role: "staff" }); return { items, sales: [], restocks: [], users: us, low: 3, nid: 1000, logs: [], udhar: [], uid: 1, set: { staffStock: false, staffCost: false, staffUdhar: true, name } } }
        function ensBills(s) { s.bills = s.bills || []; s.menus = s.menus || {}; const cm = now().slice(0, 7); if (!(s.fee > 0)) return; for (let m = /^\d{4}-\d{2}$/.test(s.start || "") ? s.start : cm; m <= cm; m = mAdd(m, 1)) if (!s.bills.some(b => b.m == m)) s.bills.push({ m, amt: s.fee, pays: [] }) }
        function autoChk() { reg.shops.forEach(s => { ensBills(s); if (s.status == "active" && s.auto && sOv(s)) { s.status = "inactive"; evt(s, "Auto inactive: bill unpaid (baqaya " + fmt(sBal(s)) + ")") } }); sv2() }
        async function regInit() {
            reg = JSON.parse(localStorage.getItem(RK) || "null");
            if (!reg) {
                const old = JSON.parse(localStorage.getItem("shopdb1") || "null"); reg = { owners: [{ id: 1, u: "owner", p: await H("owner123"), name: "Owner", contact: "", role: "super", active: true, access: {}, def: true }], shops: [], sid: 2, oid: 2 };
                const s = { id: 1, key: "shopdb1", name: (old && old.set && old.set.name) || "Shop System", contact: "", status: "active", fee: 0, dueDay: 10, grace: 5, auto: true, start: now().slice(0, 7), menus: {}, bills: [], created: Date.now(), last: null, ev: [] };
                if (!old) localStorage.setItem("shopdb1", JSON.stringify(await mkDb(s.name, "admin", "admin123", sItems(), true))); reg.shops.push(s); sv2()
            }
            autoChk()
        }
        function logout() { me = null; cur = null; db = null; render() }
        const uTaken = u => { const l = u.toLowerCase(); return reg.owners.some(o => o.u.toLowerCase() == l) || reg.shops.some(s => ((sDb(s) || { users: [] }).users).some(x => x.u.toLowerCase() == l)) };
        function loginView(a) {
            a.innerHTML = `<div id="login" class="card"><h3>${esc(reg.shops.length == 1 ? reg.shops[0].name : "Shop System")} - Login</h3><label>Username</label><input id="lu" autocomplete="username"><label>Password</label><input id="lp" type="password" autocomplete="current-password" onkeydown="if(event.key=='Enter')login()"><button class="p" onclick="login()">Login</button><p><small>Kindly enter your username and password.</small></p><p><small>Password bhool gaye? Owner se rabta karein.</small></p></div>`
        }
        let pend = null;
        async function login() {
            const u = $("#lu").value.trim(), p = await H($("#lp").value); if (!u) return alert("Username likhein.");
            const o = reg.owners.find(y => y.u == u && y.p == p);
            if (o) { if (!o.active) return alert("Ye login inactive hai. Super owner se rabta karein."); ow = o; o.last = Date.now(); sv2(); ot = "dash"; return render() }
            autoChk(); const M = []; reg.shops.forEach(s => { const d = sDb(s), x = d && d.users.find(y => y.u == u && y.p == p); if (x) M.push(s.id) });
            if (!M.length) return alert("Username ya password galat hai.");
            const A = M.filter(id => shp(id).status == "active"); if (!A.length) return alert("Is shop ka system band (inactive) hai. Bill / payment ke liye owner se rabta karein.");
            pend = { u, p }; if (A.length == 1) return enter(A[0]);
            showMd(`<h3>Kaun si shop?</h3>${A.map(id => `<button class="p" style="display:block;width:100%;margin-bottom:8px" onclick="enter(${id})">${esc(shp(id).name)}</button>`).join("")}<button onclick="closeMd()">Cancel</button>`)
        }
        function enter(id) {
            closeMd(); const s = shp(id); if (!pend || !s) return; db = sDb(s); if (!db) return alert("Is shop ka data nahi mila."); cur = s; K = s.key; fix(); const x = db.users.find(y => y.u == pend.u && y.p == pend.p); pend = null;
            if (!x) { db = null; cur = null; return alert("Username ya password galat hai.") } if (x.off) { db = null; cur = null; return alert("Ye user inactive hai. Admin se rabta karein.") }
            me = { u: x.u, role: x.role }; s.last = { ts: Date.now(), u: x.u }; sv2(); tab = x.role == "admin" ? "dash" : "sale"; sd = now(); render()
        }
        // ---- Owner pages
        function renderOwner() {
            autoChk(); const a = $("#app"), T = OT.filter(t => oAcc(t[0])); if (!T.length) { ow = null; return render() } if (!T.some(t => t[0] == ot)) ot = T[0][0]; document.title = "Owner Panel";
            a.innerHTML = `<header><b>Owner Panel</b><nav>${T.map(t => `<button class="${ot == t[0] ? "on" : ""}" onclick="ot='${t[0]}';render()">${t[1]}</button>`).join("")}</nav><span>${esc(ow.name || ow.u)} (${ow.role}) <button class="p" onclick="ow=null;lm='shop';render()">Logout</button></span></header><main>${({ dash: oDash, shops: oShops, bills: oBills, own: oOwn, obk: oBk })[ot]()}</main>`
        }
        function oDash() {
            const S = reg.shops, cm = now().slice(0, 7), MB = S.flatMap(s => s.bills.filter(b => b.m == cm)), pm = sum(S, s => sum(s.bills, b => sum(b.pays.filter(p => dk(p.ts).slice(0, 7) == cm), p => p.amt))), k = (a, b) => `<div class="k">${a}<b>${b}</b></div>`, OV = S.filter(sOv);
            return (ow.def ? `<div class="card"><span class="adj">Default owner password abhi chal raha hai. Backup tab mein "Mera password" se badal dein.</span></div>` : "") + `<div class="grid">${k("Total Shops", S.length)}${k("Active Shops", S.filter(s => s.status == "active").length)}${k("Inactive Shops", S.filter(s => s.status != "active").length)}${k("Bill Overdue Shops", OV.length)}${k("Is mahine ka Bill (Rs)", fmt(sum(MB, b => b.amt)))}${k("Is mahine Wasool (Rs)", fmt(pm))}${k("Total Baqaya (Rs)", fmt(sum(S, sBal)))}</div>
<div class="card"><h3>Shops ka Status</h3><div class="tw"><table><tr><th>Shop<th>Contact<th>Status<th>Monthly Fee<th>Baqaya<th>Bill<th>Last Login</tr>${S.map(s => `<tr class="${sOv(s) ? "ov" : ""}"><td>${esc(s.name)}<td>${esc(s.contact || "")}<td class="${s.status == "active" ? "cl" : "out"}">${s.status == "active" ? "Active" : "Inactive"}<td>${fmt(s.fee)}<td>${fmt(sBal(s))}<td class="${sOv(s) ? "out" : "cl"}">${sOv(s) ? "Overdue" : "OK"}<td>${s.last ? dt(s.last.ts) + " (" + esc(s.last.u) + ")" : "-"}</tr>`).join("") || "<tr><td colspan=7>Koi shop nahi.</tr>"}</table></div></div>`
        }
        let shf = { q: "", st: "" };
        function oShops() {
            const q = shf.q.trim().toLowerCase(), L = reg.shops.filter(s => (!q || s.name.toLowerCase().includes(q) || String(s.contact || "").includes(q) || adm(s).toLowerCase().includes(q)) && (!shf.st || (shf.st == "Active") == (s.status == "active"))), d = now(), sm = +d.slice(8) <= 10 ? d.slice(0, 7) : mAdd(d.slice(0, 7), 1);
            return `<div class="card"><h3>Nayi Shop</h3><div class="row"><div><label>Shop Name</label><input id="nsn" style="width:160px"></div><div><label>Contact</label><input id="nsc" placeholder="0300-1234567" style="width:140px"></div><div><label>Admin Username</label><input id="nsu" style="width:120px"></div><div><label>Admin Password</label><input id="nsp" style="width:120px"></div></div><div class="row" style="margin-top:8px"><div><label>Monthly Fee (Rs)</label><input id="nsf" type="number" min="0" value="0" style="width:110px"></div><div><label>Due Day (1-28)</label><input id="nsd" type="number" min="1" max="28" value="10" style="width:90px"></div><div><label>Bill shuru (mahina)</label><input id="nsm" type="month" value="${sm}" style="width:150px"></div><button class="p" onclick="addShop()">Add Shop</button></div></div>
<div class="card"><div class="row"><h3>Shops (${L.length})</h3><div><label>Search (naam / contact / admin)</label><input value="${esc(shf.q)}" style="width:170px" onchange="shf.q=this.value;render()"></div><div><label>Status</label><select onchange="shf.st=this.value;render()">${["", "Active", "Inactive"].map(x => `<option value="${x}" ${shf.st == x ? "selected" : ""}>${x || "Sab"}</option>`).join("")}</select></div></div><div class="tw"><table><tr><th>ID<th>Shop<th>Contact<th>Admin<th>Status<th>Fee<th>Baqaya<th>Last Login<th>Action</tr>${L.map(s => `<tr class="${sOv(s) ? "ov" : ""}"><td>${s.id}<td>${esc(s.name)}<td>${esc(s.contact || "")}<td>${esc(adm(s))}<td class="${s.status == "active" ? "cl" : "out"}">${s.status == "active" ? "Active" : "Inactive"}<td>${fmt(s.fee)}<td>${fmt(sBal(s))}<td>${s.last ? dt(s.last.ts) : "-"}<td><button class="p" onclick="manage(${s.id})">Manage</button> <button class="${s.status == "active" ? "d" : "p"}" onclick="togShop(${s.id})">${s.status == "active" ? "Inactive" : "Active"}</button></tr>`).join("") || "<tr><td colspan=9>Koi shop nahi.</tr>"}</table></div></div>`
        }
        async function addShop() {

            if (!n) return alert("Shop ka naam likhein."); if (reg.shops.some(s => s.name.toLowerCase() == n.toLowerCase())) return alert("Is naam ki shop pehle se hai."); if (c && !okPh(c)) return alert("Contact sahi likhein, jaise 0300-1234567 (ya khali chhor dein)."); if (!u) return alert("Admin username likhein."); if (uTaken(u)) return alert("Ye username pehle se kisi aur login ke paas hai. Alag username chunein."); if (p.length < 4) return alert("Admin password kam az kam 4 harf ka likhein.");

            const id = reg.sid++, s = { id, key: "shopdb_" + id, name: n, contact: c ? fph(c) : "", status: "active", fee: f, dueDay: d, grace: 5, auto: true, start: m, menus: {}, bills: [], created: Date.now(), last: null, ev: [] };

        function manage(id) {

            showWd(`<h3>${esc(s.name)} <small>(ID ${s.id})</small></h3><p>Status: <b class="${on ? "cl" : "out"}">${on ? "Active" : "Inactive"}</b> | Baqaya: <b>${fmt(sBal(s))}</b><br>Last login: ${s.last ? dt(s.last.ts) + " (" + esc(s.last.u) + ")" : "-"}</p>
